ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # ruff replaces what used to be five hooks here: pyupgrade, isort, black, flake8
  # and bandit. Keep the rev in step with the pin in pyproject.toml -- a ruff minor
  # release changes what is reported and what gets reformatted.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # tests/data/esc-router-v2.json is written by `make refresh-spec` and must stay
      # byte-identical to what that target produces, so it is checked but not sorted
      # or reformatted here.
      - id: check-json
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
# No check-manifest and no MANIFEST.in: hatchling decides what goes into the sdist
# from its own defaults and .gitignore, so a manifest here would be a second, silent
# source of truth. The release workflow runs build-and-inspect-python-package, which
# prints the contents of both distributions on every run -- that is the check.
