[project]
name = "edutap.esc_router_api"
version = "1.0.0a1.dev0"
description = "Library for Communication with ESC-Router"
keywords = ["api", "REST", "ESC", "European Student Card"]
readme = "README.md"
authors = [
    {name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de"},
    {name = "Philipp Auersperg-Castell", email = "phil@bluedynamics.com"},
    {name = "Jens Klein", email = "jk@kleinundpartner.at"},
]
requires-python = ">=3.10"
license = { text = "EUPL 1.2" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic[email]>=2.0",
    "pydantic_extra_types",
    "pydantic-settings",
    "phonenumbers",
    "httpx",
  ]

[project.urls]
Source = "https://github.com/edutap-eu/edutap.esc_router_api"
Issues = "https://github.com/edutap-eu/edutap.esc_router_api/issues"
Documentation = "https://docs.edutap.eu/packages/edutap_esc_router_api/index.html"

[project.optional-dependencies]
test = [
    "pytest",
    "requests-mock",
    "faker",
]
typecheck  = [
    "mypy",
    "types-requests",
    "pytest-stub",
]
develop = [
    "pdbpp",
    "ipython",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]

[tool.isort]
profile = "plone"

[tool.black]
target-version = ["py310"]
include = "src,tests"

[tool.codespell]
ignore-words-list = "discreet,"

[tool.check-manifest]
ignore = [
    ".editorconfig",
    ".pre-commit-config.yaml",
    "tox.ini",
    "mypy.ini",
    ".flake8",
    "mx.ini",
]
